name: Build morning feed

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily = 05:30 GMT in winter, 06:30 BST in summer
  workflow_dispatch:        # lets you press "Run workflow" manually
  push:
    branches: [main]        # also rebuilds whenever you edit the files

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
